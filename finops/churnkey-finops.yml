meters:
- name: subscription_tier
  description: Monthly Churnkey subscription tier, scaled to the account's churn volume.
  unit: months
  aggregation: sum
  dimensions:
  - account
  - plan
- name: churn_volume
  description: Monthly churn volume that determines the appropriate subscription tier.
  unit: usd
  aggregation: sum
  dimensions:
  - account
- name: saved_revenue
  description: Subscription revenue saved by Cancel Flow offers (pause, discount, plan change) - value recovered, not a charge.
  unit: usd
  aggregation: sum
  dimensions:
  - account
  - offerType
- name: recovered_revenue
  description: Involuntary churn recovered by Failed Payment Recovery (dunning) - value recovered, not a charge.
  unit: usd
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track the monthly subscription cost against Cancel Flow saved revenue and dunning recovered revenue from the Data API sessions and metrics.
- name: Allocation
  description: Attribute saved and recovered revenue to plans, segments, and offer types to see where retention spend pays off.
- name: Optimization
  description: Tune Cancel Flow offers and retry logic to maximize save/recovery rate per subscription dollar; right-size the tier to actual churn volume.
- name: Accountability
  description: Assign an owner for retention outcomes; review saved/recovered revenue versus the subscription cost each billing cycle.
