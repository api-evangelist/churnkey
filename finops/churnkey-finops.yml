description: >-
  FinOps view of Churnkey spend. Churnkey is billed as a monthly SaaS
  subscription scaled to a customer's churn volume (Starter publicly listed at
  $250/month billed yearly; Core, Intelligence, and Enterprise custom-priced),
  not as a metered per-API-call service. The APIs, webhooks, React SDK, and MCP
  server carry no separate usage fee. The economic value case is retention:
  saved subscriptions from Cancel Flows and recovered involuntary churn from
  Failed Payment Recovery are weighed against the fixed subscription cost. Some
  third-party analyses describe revenue-share-style pricing on recovered
  revenue; that is not reflected on the reviewed pricing page and is left
  unreconciled here.
notes: >-
  Per-tier prices above Starter are custom; verify current subscription cost and
  any revenue-share terms with Churnkey. The dominant cost driver is the
  subscription tier tied to churn volume, offset against saved and recovered
  revenue, rather than API call volume.
