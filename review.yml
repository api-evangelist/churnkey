aid: churnkey
name: Churnkey
review:
  question: Does Churnkey expose a documented public WebSocket API?
  answer: false
  date: '2026-07-10'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Churnkey's own public integration surface
    is request/response REST over HTTPS (the Data API and the Event/Customer
    API) plus signed outbound webhooks. Webhooks are server-to-endpoint HTTP
    POST callbacks, not a bidirectional WebSocket transport, and they are
    configured and delivered by Churnkey rather than modeled by the consumer. The
    Cancel Flow embed is a client-side JavaScript SDK authorized with an HMAC
    authHash, not a server-push socket. There is no ws:// or wss:// endpoint to
    model, so no AsyncAPI document was created.
findings:
  summary: |
    Churnkey does not publish a documented public WebSocket API. Churnkey is
    retention infrastructure for subscription companies (Cancel Flows, Failed
    Payment Recovery / dunning, and Reactivation). Its documented server-to-server
    APIs are pure request/response REST over HTTPS: a Data API
    (https://api.churnkey.co/v1/data) for Cancel Flow sessions, aggregations, and
    GDPR data-subject requests, and an Event/Customer API
    (https://api.churnkey.co/v1/api) for event tracking, customer updates, and
    billing-contact management. Both authenticate with x-ck-api-key and x-ck-app
    headers. Churnkey also emits signed outbound webhooks (session and dunning
    events) verified via an HMAC-SHA256 ck-signature header, and the Cancel Flow
    UI is embedded client-side through a JavaScript SDK authorized with a
    server-computed HMAC authHash. No realtime, bidirectional, or streaming
    WebSocket endpoint is documented anywhere in Churnkey's API reference as of
    the review date.
  accessModel: |
    Public docs are self-serve at docs.churnkey.co. API credentials (App ID plus
    a Cancel Flow API key and a separate Data API key) are generated by the
    customer in the Churnkey dashboard under Settings; the docs note you can also
    email Churnkey to enable Data API access for your organization. Using the
    APIs requires a paid Churnkey subscription, but the documentation itself is
    open and the credentials are self-provisioned from the account settings, so
    the API surface is documented and self-serve rather than gated behind sales.
  authentication:
    - scheme: API key headers (REST)
      note: All REST requests send x-ck-api-key (Data API key or Churnkey API key) and x-ck-app (App ID) headers.
    - scheme: HMAC authHash (Cancel Flow embed)
      note: The JS SDK is initialized with an HMAC-SHA256 hash of the customer ID signed with the Cancel Flow API key, computed server-side.
    - scheme: HMAC webhook signature
      note: Outbound webhooks are signed with the organization webhookSecret and verified via the ck-signature (SHA-256 HMAC) header.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.churnkey.co/v1
      documented: true
      note: Data API (/v1/data) and Event/Customer API (/v1/api). Request/response REST.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Signed outbound session and dunning event callbacks. Server-to-endpoint HTTP POST, not WebSocket.
    - protocol: JavaScript Embed
      scheme: https
      documented: true
      note: window.churnkey.init() hosted Cancel Flow, authorized with an HMAC authHash. Client SDK, not a socket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented anywhere in Churnkey's API reference or integration docs as of the review date.
  endpointsConfirmedRest:
    - GET    https://api.churnkey.co/v1/data/sessions
    - GET    https://api.churnkey.co/v1/data/session-aggregation
    - POST   https://api.churnkey.co/v1/data/dsr/access
    - POST   https://api.churnkey.co/v1/data/dsr/delete
    - POST   https://api.churnkey.co/v1/api/events/new
    - POST   https://api.churnkey.co/v1/api/events/bulk
    - POST   https://api.churnkey.co/v1/api/events/customer-update
    - POST   https://api.churnkey.co/v1/api/events/customer-update/set-users
    - POST   https://api.churnkey.co/v1/api/events/customer-update/set-users/bulk
  endpointsModeled:
    - Reactivation (win-back) campaigns are a documented Churnkey product but expose no dedicated public REST endpoint set; they are configured in the dashboard and driven by the customer/event data surfaced through the Event Tracking and Data APIs.
sources:
  - url: https://docs.churnkey.co/
    type: Documentation
    note: Product overview - Cancel Flows, Failed Payment Recovery, Reactivations; API, webhook, event tracking, MCP server.
  - url: https://docs.churnkey.co/data-api
    type: APIReference
    note: Data API base https://api.churnkey.co/v1/data; x-ck-api-key + x-ck-app headers; sessions, session-aggregation, dsr/access, dsr/delete. All REST.
  - url: https://docs.churnkey.co/data-integrations/event-tracking/
    type: APIReference
    note: Event API base https://api.churnkey.co/v1/api; events/new, events/bulk, events/customer-update.
  - url: https://docs.churnkey.co/failed-payment-recovery/billing-contact-api/
    type: APIReference
    note: Billing Contact API - customer-update/set-users and set-users/bulk for Payment Recovery billing admins.
  - url: https://docs.churnkey.co/installing-churnkey
    type: Documentation
    note: Cancel Flow embed via window.churnkey.init() with server-computed HMAC-SHA256 authHash. Client SDK, no WebSocket.
  - url: https://docs.churnkey.co/data-integrations/webhooks/
    type: Documentation
    note: Signed outbound session/dunning webhooks verified via ck-signature (SHA-256 HMAC). Server-to-endpoint HTTP, not WebSocket.
  - url: https://churnkey.co/pricing
    type: Pricing
    note: Starter $250/mo (billed yearly); Core/Intelligence custom; Enterprise custom. API/Webhook/Slack on all plans.
actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Churnkey's own public API is
    request/response REST (Data API and Event/Customer API) plus signed outbound
    webhooks and a client-side JS embed authorized with an HMAC authHash. No
    AsyncAPI document was created because there is no server-push WebSocket
    transport on Churnkey's own API to model.
