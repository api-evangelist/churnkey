name: Churnkey
kind: company
description: Churnkey is retention and growth infrastructure for subscription
  companies. It provides personalized Cancel Flows that intercept subscription
  cancellations with pauses, discounts, plan changes and surveys; Failed Payment
  Recovery (dunning) that recovers involuntary churn; and Reactivation campaigns
  that win back churned customers. Churnkey embeds via a JavaScript SDK
  authenticated with a server-computed HMAC authHash, and exposes REST APIs for
  session/analytics data, event tracking, customer updates, billing-contact
  management, and GDPR data-subject requests, plus signed webhooks. It integrates
  with Stripe, Chargebee, Paddle, Braintree, and Maxio.
