aid: churnkey
url: https://raw.githubusercontent.com/api-evangelist/churnkey/refs/heads/main/apis.yml
name: Churnkey
kind: company
description: Churnkey is retention and growth infrastructure for subscription
  companies. It provides personalized Cancel Flows that intercept subscription
  cancellations with pauses, discounts, plan changes and surveys; Failed Payment
  Recovery (dunning) that recovers involuntary churn; and Reactivation campaigns
  that win back churned customers. Churnkey embeds via a JavaScript SDK
  authenticated with a server-computed HMAC authHash, and exposes REST APIs for
  session/analytics data, event tracking, customer updates, billing-contact
  management, and GDPR data-subject requests, plus signed webhooks. It integrates
  with Stripe, Chargebee, Paddle, Braintree, and Maxio.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Churn Prevention
- Retention
- Cancellation Flows
- Failed Payment Recovery
- Dunning
- Reactivation
- Subscriptions
- SaaS
created: '2026-07-10'
modified: '2026-07-10'
specificationVersion: '0.19'
apis:
- aid: churnkey:churnkey-data-api
  name: Churnkey Data API
  tags:
  - Sessions
  - Cancel Flows
  - Analytics
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.churnkey.co/data-api
  baseURL: https://api.churnkey.co/v1/data
  properties:
  - url: https://docs.churnkey.co/data-api
    type: Documentation
  - url: openapi/churnkey-openapi.yml
    type: OpenAPI
  - url: collections/churnkey.postman_collection.json
    type: PostmanCollection
  - url: collections/churnkey.opencollection.json
    type: OpenCollection
  description: Query Cancel Flow session data programmatically. List sessions with
    rich filters (customer, plan, blueprint, A/B test, offer type, save type,
    coupon, date range) and retrieve grouped/aggregated session counts by month,
    plan, offer type, and more. Authenticated with a Data API key and App ID
    headers, distinct from the Cancel Flow API key.
- aid: churnkey:churnkey-event-tracking-api
  name: Churnkey Event Tracking API
  tags:
  - Events
  - Customers
  - Tracking
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.churnkey.co/data-integrations/event-tracking/
  baseURL: https://api.churnkey.co/v1/api
  properties:
  - url: https://docs.churnkey.co/data-integrations/event-tracking/
    type: Documentation
  - url: openapi/churnkey-openapi.yml
    type: OpenAPI
  - url: collections/churnkey.postman_collection.json
    type: PostmanCollection
  - url: collections/churnkey.opencollection.json
    type: OpenCollection
  description: Send customer events into Churnkey to enrich segmentation, targeting,
    and passive data collection. Create single events, bulk events (up to 100 per
    request), and update customer or B2B user attributes used as email merge tags
    and segmentation inputs.
- aid: churnkey:churnkey-billing-contact-api
  name: Churnkey Billing Contact API
  tags:
  - Payment Recovery
  - Dunning
  - Billing Contacts
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.churnkey.co/failed-payment-recovery/billing-contact-api/
  baseURL: https://api.churnkey.co/v1/api
  properties:
  - url: https://docs.churnkey.co/failed-payment-recovery/billing-contact-api/
    type: Documentation
  - url: openapi/churnkey-openapi.yml
    type: OpenAPI
  - url: collections/churnkey.postman_collection.json
    type: PostmanCollection
  - url: collections/churnkey.opencollection.json
    type: OpenCollection
  description: Configure the billing contacts that receive Failed Payment Recovery
    (dunning) communications. Attach one or more users to a customer and flag which
    are billing admins, improving recovery rates for team accounts and organizations
    with multiple administrators. Supports single and bulk updates.
- aid: churnkey:churnkey-data-subject-requests-api
  name: Churnkey Data Subject Requests API
  tags:
  - GDPR
  - Privacy
  - Compliance
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.churnkey.co/data-api
  baseURL: https://api.churnkey.co/v1/data
  properties:
  - url: https://docs.churnkey.co/data-api
    type: Documentation
  - url: openapi/churnkey-openapi.yml
    type: OpenAPI
  - url: collections/churnkey.postman_collection.json
    type: PostmanCollection
  - url: collections/churnkey.opencollection.json
    type: OpenCollection
  description: GDPR data-subject request endpoints for retrieving or deleting all
    personal data Churnkey has stored for a user, identified by email. Supports
    privacy access and erasure workflows.
- aid: churnkey:churnkey-cancel-flow-embed
  name: Churnkey Cancel Flow Embed
  tags:
  - Cancel Flows
  - Embed
  - HMAC Auth
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.churnkey.co/installing-churnkey
  baseURL: https://api.churnkey.co/v1
  properties:
  - url: https://docs.churnkey.co/installing-churnkey
    type: Documentation
  - url: https://docs.churnkey.co/integrations/general/
    type: Documentation
  description: Client-side embed surface for personalized Cancel Flows. The
    JavaScript SDK is initialized with window.churnkey.init(), passing an appId,
    customerId, subscriptionId, provider, and a server-computed HMAC-SHA256
    authHash (the customer ID signed with the Cancel Flow API key) so the hosted
    flow can be trusted. This is a client SDK plus HMAC authorization surface
    rather than a REST resource API.
- aid: churnkey:churnkey-reactivation-api
  name: Churnkey Reactivation API
  tags:
  - Reactivation
  - Win-back
  - Campaigns
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://churnkey.co/feature/reactivations
  baseURL: https://api.churnkey.co/v1
  properties:
  - url: https://churnkey.co/feature/reactivations
    type: Documentation
  description: Reactivation (win-back) campaigns that re-engage churned or paused
    customers with targeted offers. Reactivations are a documented Churnkey product,
    but a dedicated public REST endpoint set is not published; campaigns are
    configured in the Churnkey dashboard and driven by the same customer/event data
    surfaced through the Event Tracking and Data APIs. Endpoints here are modeled,
    not confirmed from public reference documentation.
