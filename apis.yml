apis:
- aid: churnkey:churnkey-cancel-flow-embed
  name: Churnkey Cancel Flow Embed
  tags:
  - Cancel Flows
  - Embed
  - HMAC Auth
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.churnkey.co/installing-churnkey
  baseURL: https://api.churnkey.co/v1
  properties:
  - url: https://docs.churnkey.co/installing-churnkey
    type: Documentation
  - url: https://docs.churnkey.co/integrations/general/
    type: Documentation
  description: >-
    Client-side embed surface for personalized Cancel Flows. The JavaScript SDK is initialized with window.churnkey.init(),
    passing an appId, customerId, subscriptionId, provider, and a server-computed HMAC-SHA256 authHash
    (the customer ID signed with the Cancel Flow API key) so the hosted flow can be trusted. This is a
    client SDK plus HMAC authorization surface rather than a REST resource API.
- aid: churnkey:churnkey-reactivation-api
  name: Churnkey Reactivation API
  tags:
  - Reactivation
  - Win-back
  - Campaigns
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://churnkey.co/feature/reactivations
  baseURL: https://api.churnkey.co/v1
  properties:
  - url: https://churnkey.co/feature/reactivations
    type: Documentation
  description: >-
    Reactivation (win-back) campaigns that re-engage churned or paused customers with targeted offers.
    Reactivations are a documented Churnkey product, but a dedicated public REST endpoint set is not published;
    campaigns are configured in the Churnkey dashboard and driven by the same customer/event data surfaced
    through the Event Tracking and Data APIs. Endpoints here are modeled, not confirmed from public reference
    documentation.
